<!DOCTYPE html>
<html lang="kk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Командалық жоба — Басты бет</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0b1220;
  --line:#26354f;
  --cyan:#38bdf8;
  --violet:#818cf8;
  --text:#f1f5f9;
  --muted:#94a3b8;
  --font:"Noto Sans","Segoe UI",system-ui,-apple-system,Arial,sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  font-family:var(--font);
  background:var(--bg);
  color:var(--text);
  min-height:100vh;
  display:grid;
  place-items:center;
  padding:40px 18px;
  overflow-x:hidden;
  line-height:1.6;
}
:focus-visible{outline:3px solid var(--cyan);outline-offset:4px;border-radius:12px}

/* Фон */
.orb{position:fixed;width:46vmax;height:46vmax;border-radius:50%;filter:blur(90px);opacity:.33;pointer-events:none;animation:float 18s ease-in-out infinite alternate}
.orb.a{background:#0ea5e9;top:-20vmax;left:-15vmax}
.orb.b{background:#6366f1;bottom:-22vmax;right:-14vmax;animation-delay:-8s}
.grid{position:fixed;inset:0;pointer-events:none;
  background-image:linear-gradient(#ffffff0a 1px,transparent 1px),linear-gradient(90deg,#ffffff0a 1px,transparent 1px);
  background-size:48px 48px;
  -webkit-mask-image:radial-gradient(circle at 50% 40%,#000 10%,transparent 70%);
  mask-image:radial-gradient(circle at 50% 40%,#000 10%,transparent 70%)}
.dot{position:fixed;bottom:-10px;width:4px;height:4px;border-radius:50%;background:var(--cyan);opacity:0;pointer-events:none;animation:up linear infinite}

/* Мазмұн */
main{position:relative;width:100%;max-width:780px;text-align:center}
h1{
  font-size:clamp(30px,6vw,54px);
  font-weight:800;
  line-height:1.15;
  color:transparent;
  background:linear-gradient(100deg,#fff 30%,var(--cyan) 45%,var(--violet) 55%,#fff 70%) 0 0/250% 100%;
  -webkit-background-clip:text;
  background-clip:text;
  animation:rise .9s cubic-bezier(.2,.7,.2,1) both,sheen 8s ease-in-out 1.4s infinite;
}
.lead{margin:16px auto 0;max-width:46ch;color:var(--muted);font-size:18px;animation:rise .9s cubic-bezier(.2,.7,.2,1) .2s both}
.line{width:72px;height:4px;margin:26px auto 0;border-radius:2px;background:linear-gradient(90deg,var(--cyan),var(--violet));animation:grow .8s ease .5s both}

.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:22px;margin-top:44px;text-align:left}
.card{
  position:relative;display:block;padding:28px;border-radius:22px;overflow:hidden;
  text-decoration:none;color:inherit;
  background:linear-gradient(180deg,#14213b,#0f1a2f);
  border:1px solid var(--line);
  transition:transform .2s ease,border-color .3s,box-shadow .3s;
  animation:rise .9s cubic-bezier(.2,.7,.2,1) backwards;
}
.card:nth-child(1){animation-delay:.6s}
.card:nth-child(2){animation-delay:.8s}
.card::before{content:"";position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .3s;
  background:radial-gradient(280px circle at var(--mx,50%) var(--my,0%),#38bdf833,transparent 70%)}
.card:hover::before{opacity:1}
.card:hover{border-color:#38bdf8aa;box-shadow:0 26px 50px -26px #0ea5e9bb}
.card>*{position:relative}

.ava{width:68px;height:68px;border-radius:20px;display:grid;place-items:center;font-size:34px;margin-bottom:20px;
  background:linear-gradient(135deg,#0ea5e9,#6366f1);box-shadow:0 12px 24px -12px #0ea5e9;animation:bob 4s ease-in-out infinite}
.card:nth-child(2) .ava{animation-delay:-2s}
.who{color:var(--muted);font-size:15px}
.hero{font-size:23px;font-weight:800;line-height:1.3;margin:2px 0 4px}
.tag{color:var(--muted);font-size:15px;margin-bottom:20px}
.go{display:inline-flex;align-items:center;gap:8px;font-weight:600;color:var(--cyan)}
.go span{transition:transform .25s}
.card:hover .go span{transform:translateX(7px)}

footer{margin-top:44px;color:#64748b;font-size:14px;animation:rise .9s ease 1.1s backwards}

/* Анимациялар */
@keyframes rise{from{opacity:0;transform:translateY(28px)}to{opacity:1;transform:none}}
@keyframes grow{from{width:0}to{width:72px}}
@keyframes sheen{from{background-position:100% 0}60%,to{background-position:0 0}}
@keyframes float{to{transform:translate(6vmax,5vmax) scale(1.15)}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes up{0%{opacity:0;transform:translateY(0)}15%{opacity:.8}100%{opacity:0;transform:translateY(-105vh)}}

@media (max-width:560px){
  body{padding:28px 14px}
  .card{padding:24px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}
</style>
</head>
<body>
<div class="orb a" aria-hidden="true"></div>
<div class="orb b" aria-hidden="true"></div>
<div class="grid" aria-hidden="true"></div>

<main>
  <h1>Командалық жоба қатысушылары</h1>
  <p class="lead">Қатысушылардың беттеріне сілтемелер. Кейіпкерді таңдап, жеке бетіне өтіңіз.</p>
  <div class="line"></div>

  <div class="cards">
    <a class="card" href="Tursyntay-favorite-hero.html">
      <div class="ava" aria-hidden="true">⛰️</div>
      <p class="who">Нұpислам
      <h2 class="hero">Алпамыс</h2>
      <p class="tag">Сүйікті кейіпкер</p>
      <span class="go">Бетке өту <span>→</span></span>
    </a>

    <a class="card" href="Madik-favorite-hero.html">
      <div class="ava" aria-hidden="true">🏃</div>
      <p class="who">Мадияр</p>
      <h2 class="hero">Желаяқ</h2>
      <p class="tag">Сүйікті кейіпкер</p>
      <span class="go">Бетке өту <span>→</span></span>
    </a>
  </div>

  <footer>© 2026 Командалық жоба</footer>
</main>

<script>
(function(){
  // Қалқып шығатын бөлшектер
  for(var i=0;i<22;i++){
    var d=document.createElement('i');
    d.className='dot';
    d.setAttribute('aria-hidden','true');
    d.style.left=(Math.random()*100)+'%';
    d.style.animationDuration=(9+Math.random()*10).toFixed(1)+'s';
    d.style.animationDelay=(-Math.random()*14).toFixed(1)+'s';
    if(i%3===0){d.style.background='#818cf8'}
    document.body.appendChild(d);
  }

  // Карточкадағы жарық және жеңіл еңкею
  var fine=matchMedia('(hover:hover) and (pointer:fine)').matches &&
           !matchMedia('(prefers-reduced-motion:reduce)').matches;
  document.querySelectorAll('.card').forEach(function(c){
    c.addEventListener('pointermove',function(e){
      var r=c.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top;
      c.style.setProperty('--mx',x+'px');
      c.style.setProperty('--my',y+'px');
      if(fine){
        c.style.transform='perspective(800px) rotateX('+((.5-y/r.height)*8).toFixed(2)+'deg) rotateY('+((x/r.width-.5)*8).toFixed(2)+'deg) translateY(-4px)';
      }
    });
    c.addEventListener('pointerleave',function(){c.style.transform=''});
  });
})();
</script>
</body>
</html>
